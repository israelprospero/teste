<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: monospace;
      color: #eee;
    }
    h1 { margin-bottom: 10px; font-size: 1.4rem; letter-spacing: 2px; }
    #score { margin-bottom: 8px; font-size: 1rem; }
    canvas {
      border: 2px solid #4ecca3;
      background: #16213e;
      display: block;
    }
    #message {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #4ecca3;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="score">Score: 0</div>
  <canvas id="canvas" width="400" height="400"></canvas>
  <div id="message">Press any arrow key to start</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const messageEl = document.getElementById('message');

    const CELL = 20;
    const COLS = canvas.width / CELL;
    const ROWS = canvas.height / CELL;

    let snake, dir, nextDir, food, score, loop, running, started;

    function init() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      running = false;
      started = false;
      scoreEl.textContent = 'Score: 0';
      messageEl.textContent = 'Press any arrow key to start';
      spawnFood();
      draw();
    }

    function spawnFood() {
      let pos;
      do {
        pos = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function start() {
      if (running) return;
      running = true;
      started = true;
      messageEl.textContent = '';
      loop = setInterval(tick, 150);
    }

    function tick() {
      dir = nextDir;

      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        return gameOver();
      }

      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = 'Score: ' + score;
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      clearInterval(loop);
      running = false;
      draw();
      messageEl.textContent = 'Game over! Press any arrow key to restart';
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Food
      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.arc(
        food.x * CELL + CELL / 2,
        food.y * CELL + CELL / 2,
        CELL / 2 - 2,
        0, Math.PI * 2
      );
      ctx.fill();

      // Snake
      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#4ecca3' : '#2ebd93';
        ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
      });
    }

    document.addEventListener('keydown', e => {
      const keys = {
        ArrowUp:    { x: 0,  y: -1 },
        ArrowDown:  { x: 0,  y:  1 },
        ArrowLeft:  { x: -1, y:  0 },
        ArrowRight: { x: 1,  y:  0 },
      };

      const newDir = keys[e.key];
      if (!newDir) return;

      e.preventDefault();

      // Prevent reversing
      if (newDir.x === -dir.x && newDir.y === -dir.y) return;

      nextDir = newDir;

      if (!started) {
        start();
      } else if (!running) {
        init();
        nextDir = newDir;
        start();
      }
    });

    init();
  </script>
</body>
</html>
